# Frozen dependency closure for reproducible container builds.
#
# Captured with `pip freeze` from the first green build (Python 3.14 /
# python:3.14-alpine3.22, matrix-registration 1.0.2). build.sh installs the app
# under `-c requirements.lock`, so this pins the EXACT transitive set the image
# ships. Regenerate deliberately (rebuild without the constraint, re-freeze) when
# intentionally moving dependencies; do not hand-edit individual pins.
#
# The matrix-registration package itself is intentionally omitted (a package does
# not constrain its own version).
